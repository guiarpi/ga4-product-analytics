# Regenerate dashboard.html from BigQuery (roadmap E8): weekly, or by hand from
# the Actions tab. Commits only if the page changed in anything but its
# generated date — on the static public sample a scheduled run changes nothing
# else, so it makes no commit.
#
# Authentication is keyless (Workload Identity Federation): GitHub's short-lived
# OIDC token is exchanged for a Google service account that can only run
# BigQuery jobs, and only for this repo's main branch. No key exists anywhere.
# Set up once with ci/setup_gcp_wif.sh (see docs/DASHBOARD_GUIDE.md).
#
# Secrets (not variables: this repo's Actions logs are public, and secrets are
# masked in them): GA4_PROJECT_ID, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT.
#
# The AI brief is not regenerated here: the reviewed product_brief_ga4_funnel.md
# in the repo is embedded as it is. Writing a new brief stays a local,
# human-reviewed step (notebook Section 9).
name: regenerate dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"      # Mondays 06:17 UTC

permissions:
  contents: write             # commit dashboard.html
  id-token: write             # the OIDC token for keyless Google auth

concurrency:
  group: regenerate-dashboard
  cancel-in-progress: false   # never cut a run off mid-commit

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    env:
      GA4_PROJECT_ID: ${{ secrets.GA4_PROJECT_ID }}
      GA4_MAX_BYTES_BILLED: 5GB
    steps:
      # Until ci/setup_gcp_wif.sh has been run the secrets are empty: end quietly
      # with a notice instead of failing (and e-mailing) every week.
      - name: Is the keyless setup done?
        id: setup
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          if [ -n "$GA4_PROJECT_ID" ] && [ -n "$WIF_PROVIDER" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not set up yet — run ci/setup_gcp_wif.sh (see docs/DASHBOARD_GUIDE.md). Skipping."
          fi

      - uses: actions/checkout@v5
        if: steps.setup.outputs.configured == 'true'

      - uses: actions/setup-python@v6
        if: steps.setup.outputs.configured == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install the pinned versions behind the committed outputs
        if: steps.setup.outputs.configured == 'true'
        run: pip install -r requirements-lock.txt

      - name: Authenticate to Google Cloud (keyless)
        if: steps.setup.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Estimate the scan (free) — stops if any query is over the cap
        if: steps.setup.outputs.configured == 'true'
        run: python generate_dashboard.py --dry-run

      - name: Regenerate the dashboard
        if: steps.setup.outputs.configured == 'true'
        run: python generate_dashboard.py

      - name: Did anything but the date change?
        if: steps.setup.outputs.configured == 'true'
        id: diff
        run: python ci_utils.py dashboard-changed

      - name: Commit and push the new dashboard
        if: steps.setup.outputs.configured == 'true' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Regenerate dashboard (scheduled)"
          git push

      - name: Nothing to commit
        if: steps.setup.outputs.configured == 'true' && steps.diff.outputs.changed != 'true'
        run: echo "dashboard.html changed only in its generated date — no commit."
